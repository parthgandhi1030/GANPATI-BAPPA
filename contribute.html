<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribution - Ishwar Bhuvan Cha Raja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-400 via-orange-500 to-red-600 min-h-screen text-white">
  
  <div class="max-w-4xl mx-auto px-6 py-10">
    <h1 class="text-5xl font-bold text-center mb-8 drop-shadow-lg">🙏 Prasad to Ganpati Bappa 🙏</h1>

    <div class="bg-white/20 rounded-2xl shadow-lg p-6 space-y-6">
      <p class="text-lg leading-relaxed text-white">
        We warmly welcome your contribution towards <b>Ishwar Bhuvan Cha Raja</b> 🙌.  
        Each devotee can offer <b>Prasad</b> by contributing any amount with love and devotion ❤️.  
        Remember, <span class="font-bold text-yellow-300">every offering, big or small, adds divine blessings</span> ✨🌺.
      </p>

      <form class="space-y-6">
        <!-- Name -->
        <div>
          <label class="block text-lg mb-2">Your Name</label>
          <input type="text" class="w-full p-3 rounded-lg text-black" placeholder="Enter your name" required>
        </div>

        <!-- Contact -->
        <div>
          <label class="block text-lg mb-2">Contact Number</label>
          <input type="tel" class="w-full p-3 rounded-lg text-black" placeholder="Enter your mobile number" required>
        </div>

        <!-- Day Selection -->
        <div>
          <label class="block text-lg mb-2">Select Day</label>
          <select class="w-full p-3 rounded-lg text-black" required>
            <option value="">-- Choose a Day --</option>
            <option>27th August</option>
            <option>28th August</option>
            <option>29th August</option>
            <option>30th August</option>
            <option>31st August (Visarjan)</option>
          </select>
        </div>

        <!-- Time Selection -->
        <div>
          <label class="block text-lg mb-2">Choose Aarti Time</label>
          <select class="w-full p-3 rounded-lg text-black" required>
            <option value="">-- Choose Time --</option>
            <option>27th – 30th Aug: Morning Aarti (8:00 AM)</option>
            <option>27th – 30th Aug: Evening Aarti (8:30 PM)</option>
            <option>31st Aug: Morning Aarti (8:15 AM)</option>
            <option>31st Aug: Afternoon Aarti (2:30 PM)</option>
          </select>
        </div>

        <!-- Custom Contribution -->
        <div>
          <label class="block text-lg mb-2">Contribution Amount (₹)</label>
          <input type="number" min="1" class="w-full p-3 rounded-lg text-black" placeholder="Enter your contribution amount" required>
        </div>

        <!-- Submit -->
        <div class="text-center">
          <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-black px-8 py-3 rounded-xl font-bold shadow-lg">
            ✅ Confirm Contribution
          </button>
        </div>
      </form>
    </div>

    <div class="text-center mt-10">
      <a href="index.html" class="bg-white/80 hover:bg-white text-red-700 px-6 py-3 rounded-xl font-bold shadow-lg">
        ⬅ Back to Home
      </a>
    </div>
  </div>

</body>
</html>
