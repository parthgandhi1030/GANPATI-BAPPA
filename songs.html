<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devotional Songs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      color: #333;
      text-align: center;
      padding: 20px;
    }

    header {
      background: #ff5733;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .songs {
      margin: 20px auto;
      max-width: 500px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .song-item {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .song-item:hover {
      background: #ffe6e6;
    }

    .player {
      margin-top: 15px;
    }

    .player button {
      background: #ff5733;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }

    .player button:hover {
      background: #c70039;
    }
  </style>
</head>
<body>

  <header>🎶 Devotional Songs 🎶</header>

  <div class="songs">
    <div id="song-list"></div>
    <div class="player">
      <p id="now-playing">Select a song to play</p>
      <audio id="audio-player" controls style="width: 100%;"></audio><br>
      <button onclick="playSong()">▶ Play</button>
      <button onclick="pauseSong()">⏸ Pause</button>
    </div>
  </div>

  <script>
    const songs = [
      { title: "Jai Ganesh Deva Aarti", artist: "Anuradha Paudwal", url: "jaiganesh.mp3" },
      { title: "Sukhkarta Dukhharta", artist: "Lata Mangeshkar", url: "sukhkarta.mp3" },
      { title: "Shendur Lal Chadhayo", artist: "Ravindra Sathe", url: "shendur.mp3" }, 
      { title: "Vakratunda Mahakaya", artist: "Shankar Mahadevan", url: "Vakratunda.mp3" }
    ];

    const songList = document.getElementById("song-list");
    const audioPlayer = document.getElementById("audio-player");
    const nowPlaying = document.getElementById("now-playing");

    songs.forEach((song) => {
      const div = document.createElement("div");
      div.classList.add("song-item");
      div.textContent = `${song.title} - ${song.artist}`;
      div.onclick = () => {
        audioPlayer.src = song.url;
        audioPlayer.play();
        nowPlaying.textContent = `Now Playing: ${song.title} 🎶`;
      };
      songList.appendChild(div);
    });

    function playSong() {
      audioPlayer.play();
    }

    function pauseSong() {
      audioPlayer.pause();
    }
  </script>
</body>
</html>
